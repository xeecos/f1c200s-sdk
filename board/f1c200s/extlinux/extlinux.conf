# extlinux — SD 卡第一分区(FAT32)的 distro 启动描述
# u-boot (licheepi nano-v2018.01) distro boot 会自动扫描各分区
# /extlinux/extlinux.conf 并执行第一个匹配项。
# 路径均为相对分区根: zImage 与 dtb 需与 kernel 产物同名拷贝到分区根。
# 若内核变大导致与 0x80C00000 处 dtb 冲突，把 KERNEL 改为独立 FAT 分区即可。
LABEL f1c200s
    KERNEL /zImage
    FDT /suniv-f1c100s-licheepi-nano.dtb
    APPEND console=ttyS0,115200 panic=5 root=/dev/mmcblk0p2 rw rootwait
